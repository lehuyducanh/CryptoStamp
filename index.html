<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VecMotion Studio — Motion & Hoạt hình vector</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">◈ VecMotion</div>
    <div class="tgroup">
      <button class="tool active" data-tool="select" title="Chọn (V)">➤</button>
      <button class="tool" data-tool="rect" title="Chữ nhật (R)">▭</button>
      <button class="tool" data-tool="ellipse" title="Elip (E)">◯</button>
    </div>
    <div class="tgroup">
      <button id="tb-group" title="Nhóm các đối tượng đang chọn (Ctrl+G)">⧉ Nhóm</button>
      <button id="tb-undo" title="Hoàn tác (Ctrl+Z)">↩</button>
      <button id="tb-redo" title="Làm lại (Ctrl+Shift+Z)">↪</button>
    </div>
    <div class="spacer"></div>
    <div class="tgroup">
      <button id="tb-new">Mới</button>
      <button id="tb-open">Mở</button>
      <button id="tb-save">Lưu</button>
      <button id="tb-exp-svg" title="Xuất SVG khung hình hiện tại">SVG</button>
      <button id="tb-exp-anim" title="Xuất SVG động (CSS keyframes) — hợp clip ngắn/loop">⬇ SVG động</button>
      <button id="tb-exp-video" class="primary" title="Xuất WebM hoặc chuỗi PNG — dùng cho video dài">⬇ Video</button>
    </div>
    <div class="tgroup">
      <button id="tb-zoom-out">−</button>
      <span id="tb-zoom">100%</span>
      <button id="tb-zoom-in">＋</button>
      <button id="tb-zoom-fit">Vừa</button>
    </div>
  </header>

  <aside id="left-panel">
    <section id="ai-panel">
      <h3>✨ Tạo element bằng AI</h3>
      <div class="field"><label>Nguồn</label><select id="ai-provider"></select></div>
      <div class="field" id="ai-key-row" hidden>
        <label>API key</label><input id="ai-key" type="password" placeholder="sk-...">
      </div>
      <div class="field">
        <textarea id="ai-prompt" rows="3" placeholder="Ví dụ: chú robot dễ thương màu xanh"></textarea>
      </div>
      <div class="field row">
        <label class="chk"><input id="ai-style" type="checkbox" checked> Gợi ý flat vector</label>
        <select id="ai-size"><option value="512">512px</option><option value="768">768px</option></select>
      </div>
      <button id="ai-generate" class="primary wide">✨ Tạo ảnh</button>
      <div id="ai-status" class="status"></div>
    </section>
    <section id="assets-panel">
      <h3>Thư viện
        <label class="upload-btn">＋ Tải ảnh<input id="asset-upload" type="file" accept="image/*" multiple hidden></label>
      </h3>
      <div id="asset-grid"></div>
    </section>
  </aside>

  <main id="canvas-area">
    <div id="canvas-scroll"><div id="stage-holder"></div></div>
  </main>

  <aside id="right-panel">
    <section id="layers-panel">
      <h3>Lớp
        <span class="lbtns">
          <button data-lact="up" title="Đưa lên trên">▲</button>
          <button data-lact="down" title="Đưa xuống dưới">▼</button>
          <button data-lact="dup" title="Nhân bản (Ctrl+D)">⧉</button>
          <button data-lact="del" title="Xóa (Del)">🗑</button>
        </span>
      </h3>
      <div id="layer-list"></div>
    </section>
    <section id="inspector-panel">
      <h3>Thuộc tính</h3>
      <div id="inspector"></div>
    </section>
  </aside>

  <footer id="timeline-panel">
    <div class="tl-toolbar">
      <button id="tl-first" title="Về frame đầu">⏮</button>
      <button id="tl-play" title="Phát / Dừng (Space)">▶</button>
      <button id="tl-loop" class="active" title="Lặp lại">🔁</button>
      <button id="tl-autokey" title="Tự động ghi keyframe khi chỉnh thuộc tính">● Ghi key</button>
      <span id="tl-time">0.00s · f0</span>
      <label>Easing <select id="tl-ease"></select></label>
      <label>FPS <input id="tl-fps" type="number" min="1" max="60"></label>
      <label>Dài (s) <input id="tl-dur" type="number" min="0.5" step="0.5"></label>
      <label>Zoom <input id="tl-zoomx" type="range" min="-2" max="4" step="0.25" value="0" style="width:90px"></label>
    </div>
    <div id="tl-scroll"></div>
  </footer>
</div>

<div id="modal-root" hidden></div>
<div id="toast" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
