<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><title>Vẹt Xanh — Thư viện chuyển động</title>
<style>
body{font-family:system-ui;background:#16181d;color:#e8e4da;margin:0;padding:32px}
h1{font-weight:700}p.sub{color:#9aa0ab;margin-top:-8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:24px}
figure{margin:0;background:#faf4e8;border-radius:14px;overflow:hidden}
figure img{width:100%;display:block}
figcaption{background:#1f232b;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between}
figcaption span{color:#8b93a3}
</style></head><body>
<h1>🦜 Vẹt Xanh — Thư viện chuyển động</h1>
<p class="sub">Rig FK 14 bộ phận · SVG động tự chứa (CSS + SMIL) · dựng bằng VecMotion CLI —
sửa file .vecmotion.json tương ứng để tinh chỉnh.</p>
<div class="grid">
  <figure><img src="idle-breathe.svg" alt="Đứng thở (idle)" loading="lazy">
  <figcaption>Đứng thở (idle) <span>3.0s · loop</span></figcaption></figure>
  <figure><img src="hop.svg" alt="Nhảy lò cò (di chuyển)" loading="lazy">
  <figcaption>Nhảy lò cò (di chuyển) <span>2.0s · loop</span></figcaption></figure>
  <figure><img src="wave.svg" alt="Vẫy chào" loading="lazy">
  <figcaption>Vẫy chào <span>2.6s · loop</span></figcaption></figure>
  <figure><img src="jump-happy.svg" alt="Nhảy mừng" loading="lazy">
  <figcaption>Nhảy mừng <span>2.2s · loop</span></figcaption></figure>
  <figure><img src="look-around.svg" alt="Nhìn quanh" loading="lazy">
  <figcaption>Nhìn quanh <span>4.0s · loop</span></figcaption></figure>
  <figure><img src="talk.svg" alt="Nói chuyện" loading="lazy">
  <figcaption>Nói chuyện <span>2.4s · loop</span></figcaption></figure>
  <figure><img src="dance.svg" alt="Nhún nhảy" loading="lazy">
  <figcaption>Nhún nhảy <span>3.2s · loop</span></figcaption></figure></div>
</body></html>
